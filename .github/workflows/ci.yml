name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: std
            features: "--all-features"
            tests: ""

          - name: no_std rtu
            features: "--no-default-features --features heapless,fixedvec,rtu"
            tests: "tests"

          - name: no_std ascii
            features: "--no-default-features --features heapless,fixedvec,ascii"
            tests: "tests"

          - name: no_std tcpudp
            features: "--no-default-features --features heapless,fixedvec,tcpudp"
            tests: "tests"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test ${{ matrix.tests }} ${{ matrix.features }} -- --test-threads=1 --nocapture

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: clippy

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: |
            --all-targets -- -D warnings -W clippy::all -W clippy::pedantic
            -A clippy::used-underscore-binding
            -A clippy::doc_markdown
            -A clippy::needless_pass_by_value
            -A clippy::must_use_candidate
            -A clippy::return_self_not_must_use
            -A clippy::missing_errors_doc
            -A clippy::single_match
            -A clippy::uninlined_format_args
            -A clippy::no_effect_underscore_binding
            -A clippy::large_futures
            -A clippy::precedence
            -A clippy::manual_div_ceil
            -A clippy::non_std_lazy_statics
            -A clippy::manual_slice_fill
            -A clippy::needless-doctest-main
            -A clippy::struct-field-names
